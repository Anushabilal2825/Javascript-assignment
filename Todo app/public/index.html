
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
    <h2>To-Do Application</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button class="add-btn" onclick="addTask()">Add</button>
    <div class="error" id="error"></div>
    <ul id="taskList"></ul>
</div>

<!-- Firebase SDK -->
 <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref,push,set,onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyAfAGfcwey8eruIA7TnoN9Z-SbUNJDY7sw",
    authDomain: "to-do-app-c4fdd.firebaseapp.com",
    databaseURL: "https://to-do-app-c4fdd-default-rtdb.firebaseio.com",
    projectId: "to-do-app-c4fdd",
    storageBucket: "to-do-app-c4fdd.firebasestorage.app",
    messagingSenderId: "95381228271",
    appId: "1:95381228271:web:62077c994981605018691a",
    measurementId: "G-WTKDFEY9R2"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  
    window.addTask = function () {
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const task = taskInput.value.trim();
    if (task === "") return;

    const newRef = push(ref(database, "todos"));
    set(newRef, { text: task });

    taskInput.value = "";
  };

  onValue(ref(database, "todos"), (snapshot) => {
    const taskList = document.getElementById("taskList");
    taskList.innerHTML = "";

    snapshot.forEach((child) => {
      const li = document.createElement("li");
      li.innerText = child.val().text;

      const deleteBtn = document.createElement("button");
      deleteBtn.innerText = "Delete";
      deleteBtn.onclick = () => {
        remove(ref(database, "todos/" + child.key));
      };

      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    });
  });
</script>

 <script src="todo.js"></script>
</body>
</html>
